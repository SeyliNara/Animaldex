<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="theme-color" content="#cc0000"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="ANIMALdex"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon.png"/>
  <title>ANIMALdex</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#1a0000;font-family:'Press Start 2P',monospace;overflow-x:hidden}
    input[type=file]{display:none}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
    @keyframes scanLine{0%{top:-4px}100%{top:100%}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    .pulse{animation:pulse 2s infinite}
    .scan-line{animation:scanLine 1.2s linear infinite}
    .fade-up{animation:fadeUp 0.4s ease forwards}
    .blink{animation:blink 0.5s infinite}
    .spin{animation:spin 1s linear infinite}
    .scanlines{position:absolute;inset:0;pointer-events:none;z-index:10;
      background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.07) 2px,rgba(0,0,0,0.07) 4px)}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:#1a0a0a}
    ::-webkit-scrollbar-thumb{background:#cc0000;border-radius:2px}
    .card-hover:hover{background:rgba(0,255,100,0.09)!important}
    .btn{font-family:'Press Start 2P',monospace;cursor:pointer;border:none;transition:all 0.1s}
    .btn:active{transform:translateY(2px)}
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
    select{background:#0d0505;color:#ff9999;border:1px solid #440000;border-radius:4px;padding:4px 6px;font-size:7px;font-family:'Press Start 2P',monospace;cursor:pointer}
    .grid-cell{aspect-ratio:1;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;transition:all 0.2s;position:relative;overflow:hidden;min-height:64px}
  </style>
</head>
<body>
<div id="app"></div>
<div id="modal" style="display:none" class="modal-bg" onclick="closeModal()"></div>

<script>
// ── Constants ────────────────────────────────────────────────────────────────
const COLL_KEY="animaldex_v4_collection";
const TOTAL_SLOTS=151;
const TYPE_COLORS={Terrestre:"#A0522D",Aquatique:"#4A90D9","Aérien":"#87CEEB",Nocturne:"#4B0082",Diurne:"#FFD700",Venimeux:"#9ACD32","Prédateur":"#CC2200",Herbivore:"#228B22",Social:"#FF69B4",Solitaire:"#708090"};
const CONS_COLORS={LC:"#78C850",NT:"#A8B820",VU:"#F08030",EN:"#F08030",CR:"#C03028",EX:"#705848"};
const CLASS_EMOJI={"Mammifère":"🦁","Oiseau":"🦅","Reptile":"🦎","Amphibien":"🐸","Poisson":"🐟","Insecte":"🦋","Arachnide":"🕷️","Crustacé":"🦀"};
const REGION_IDS={"Europe":[250,276,380,724,826,528,56,616,203,752,578,246,208,372,620,40,756,442,703,705,191,348,100,642,804,498,112,428,440,233,688,807,70,8],"Afrique":[12,24,204,72,854,108,120,140,144,148,174,178,180,266,288,324,332,384,404,426,430,434,450,454,466,478,480,504,508,516,562,566,598,624,630,646,678,686,694,706,710,716,724,728,729,748,768,788,800,818,834,854,894],"Amérique du Nord":[124,484,840,192,214,332,388,558,320,222,188,591,170,862,604,218,68,32,858],"Amérique du Sud":[32,68,76,152,170,218,328,600,604,858,862],"Asie":[4,50,64,156,356,364,392,398,408,410,417,422,462,496,524,586,643,760,762,764,792,795,860],"Asie du Sud-Est":[96,116,360,418,458,104,608,702,764,704],"Océanie":[36,554,598,242,540,548,90,776,798],"Arctique":[304,352],"Antarctique":[10]};

// ── State ────────────────────────────────────────────────────────────────────
let S={
  tab:"scan", collTab:"grid",

  image:null, result:null, error:null,
  loading:false, converting:false, scanning:false, progress:0,
  collection:JSON.parse(localStorage.getItem(COLL_KEY)||"[]"),
  filterClass:"all", filterCons:"all", sortBy:"numero",
  hoveredRegion:null, mapLoaded:false, mapData:null,
};
function set(p){S={...S,...p};render()}

function saveCollection(col){
  const c=col.slice(0,200);
  localStorage.setItem(COLL_KEY,JSON.stringify(c));
  set({collection:c});
}

// ── Helpers ──────────────────────────────────────────────────────────────────
const convertToJpeg=(file)=>new Promise((resolve,reject)=>{
  const r=new FileReader();
  r.onerror=()=>reject(new Error("Lecture échouée"));
  r.onload=e=>{
    const img=new Image();
    img.onerror=()=>reject(new Error("Format non supporté. Utilise 📷 CAMÉRA."));
    img.onload=()=>{
      const c=document.createElement("canvas");
      const MAX=1024;let{width:w,height:h}=img;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX}else{w=Math.round(w*MAX/h);h=MAX}}
      c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
      resolve(c.toDataURL("image/jpeg",0.82));
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(file);
});

const led=(on,col)=>`<div style="width:12px;height:12px;border-radius:50%;background:${on?col:"#5a1a1a"};box-shadow:${on?`0 0 8px ${col},0 0 16px ${col}66`:"inset 0 1px 3px rgba(0,0,0,0.5)"};border:1px solid rgba(0,0,0,0.3);transition:all 0.3s"></div>`;
const badge=(t)=>{if(!t)return"";const c=TYPE_COLORS[t]||"#888";return`<span style="display:inline-block;background:${c};color:#fff;font-size:9px;font-weight:700;font-family:'Press Start 2P',monospace;padding:3px 7px;border-radius:4px;text-transform:uppercase;border:2px solid rgba(0,0,0,0.25)">${t}</span>`};
const statBar=(l,v,c)=>`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:8px;color:#ccc">${l}</span><span style="font-size:8px;color:#fff">${v}</span></div><div style="background:#1a0a0a;height:10px;border-radius:2px;border:1px solid #333;overflow:hidden"><div style="width:${v}%;height:100%;background:linear-gradient(90deg,${c},${c}aa);box-shadow:0 0 6px ${c}88;transition:width 1s"></div></div></div>`;
const infoBox=(l,bg,bc,lc,tc,v)=>`<div style="margin-top:8px;padding:8px 10px;background:${bg};border:1px solid ${bc};border-radius:4px"><div style="color:${lc};font-size:7px;margin-bottom:4px">${l}</div><div style="color:${tc};line-height:1.8;font-family:'VT323',monospace;font-size:13px">${v||""}</div></div>`;

function getMapColor(region){
  const count=S.collection.filter(e=>(e.result.region||"Mondial")===region).length;
  const max=Math.max(1,...["Europe","Afrique","Amérique du Nord","Amérique du Sud","Asie","Asie du Sud-Est","Océanie","Arctique","Antarctique"].map(r=>S.collection.filter(e=>(e.result.region||"Mondial")===r).length));
  if(count===0)return"#1a2a1a";
  const t=count/max;
  if(t<0.2)return"#1a4a0a";
  if(t<0.4)return"#2a6a10";
  if(t<0.6)return"#cc6600";
  if(t<0.8)return"#ee4400";
  return"#ff1100";
}

// ── Screen content ────────────────────────────────────────────────────────────
function screenHTML(){
  const{image,converting,scanning,progress,error,result,loading}=S;
  const dr=result;

  if(converting)return`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:240px;gap:14px"><div class="spin" style="font-size:28px">⚙️</div><div class="pulse" style="color:#ffaa44;font-size:8px">CONVERSION HEIC...</div></div>`;

  if(image&&!converting){
    const overlay=scanning?`
      <div class="scan-line" style="position:absolute;left:0;right:0;height:4px;background:linear-gradient(90deg,transparent,#00ff88,transparent);box-shadow:0 0 12px #00ff88;z-index:5"></div>
      <div style="position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,20,0,0.5);gap:12px">
        <div class="pulse" style="color:#00ff88;font-size:9px;letter-spacing:2px">ANALYSE...</div>
        <div style="width:160px;height:8px;background:#001a00;border:1px solid #004400;border-radius:4px;overflow:hidden"><div style="width:${progress}%;height:100%;background:linear-gradient(90deg,#00aa44,#00ff88);transition:width 0.2s"></div></div>
        <div style="color:#006622;font-size:8px">${Math.round(progress)}%</div>
      </div>`:"";
    if(scanning||(!dr&&!error))return`<div style="position:relative;height:240px"><img src="${image}" style="width:100%;height:240px;object-fit:cover;display:block;filter:${scanning?"brightness(0.35) saturate(0.2) hue-rotate(100deg)":"none"}"/>${overlay}</div>`;
  }

  if(error&&!loading)return`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:240px;padding:20px;gap:10px"><div style="font-size:28px">⚠️</div><div style="color:#ff4444;font-size:8px;text-align:center">ERREUR SCANNER</div><div style="color:#ff7766;font-size:7px;text-align:center;line-height:1.8;font-family:monospace;word-break:break-word">${error}</div></div>`;

  if(dr&&!dr.found)return`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:240px;gap:12px"><div style="font-size:30px">🔍</div><div style="color:#ffaa44;font-size:8px;text-align:center;line-height:2">AUCUN ANIMAL DÉTECTÉ</div></div>`;

  if(dr&&dr.found){
    const cc=CONS_COLORS[dr.conservation]||"#666";
    const cv={LC:95,NT:75,VU:50,EN:30,CR:15,EX:5};
    return`<div class="fade-up" style="padding:14px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px">
        <div>
          <div style="color:#00ff88;font-size:14px;letter-spacing:1px">#${dr.numero}</div>
          <div style="color:#fff;font-size:10px;margin-top:4px">${(dr.nomCommun||"").toUpperCase()}</div>
          <div style="color:#888;margin-top:4px;font-style:italic;font-family:'VT323',monospace;font-size:13px">${dr.nomScientifique||""}</div>
        </div>
        <div style="background:${cc};color:#fff;padding:4px 8px;border-radius:4px;font-size:8px;font-weight:700;border:2px solid rgba(0,0,0,0.3);flex-shrink:0">${dr.conservation||""}</div>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">${badge(dr.type1)}${badge(dr.type2)}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        ${[["CLASSE",dr.classe],["RÉGIME",dr.regime],["TAILLE",dr.taille],["POIDS",dr.poids]].map(([l,v])=>`<div style="background:rgba(0,255,100,0.05);border:1px solid #004422;border-radius:4px;padding:5px 7px"><div style="color:#006622;font-size:7px;margin-bottom:2px">${l}</div><div style="color:#aaffcc;font-size:7px">${v||"—"}</div></div>`).join("")}
      </div>
      <div style="margin-top:10px;padding:6px 10px;background:rgba(0,255,100,0.08);border:1px solid #00ff8844;border-radius:4px;text-align:center">
        <span style="color:#00ff88;font-size:7px">✓ AJOUTÉ À TON POKÉDEX</span>
      </div>
    </div>`;
  }

  return`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:240px;gap:14px">
    <div class="pulse" style="font-size:40px;filter:drop-shadow(0 0 8px #00ff88)">🦎</div>
    <div style="color:#00cc44;font-size:9px;text-align:center;line-height:2">PRÊT À SCANNER</div>
    <div style="color:#004411;font-size:7px;text-align:center">JPEG · PNG · HEIC · HEIF</div>
  </div>`;
}

function detailPanelHTML(){
  const dr=S.result;
  if(!dr||!dr.found)return"";
  const cv={LC:95,NT:75,VU:50,EN:30,CR:15,EX:5};
  return`<div class="fade-up" style="margin-top:10px;background:#0d1a0d;border:2px solid #222;border-radius:8px;padding:14px;position:relative">
    <div class="scanlines"></div>
    ${statBar("VITALITÉ",cv[dr.conservation]||50,"#00cc55")}
    ${statBar("RARETÉ",100-(cv[dr.conservation]||50),"#ff6644")}
    ${statBar("CONFIANCE",dr.confiance==="haute"?90:dr.confiance==="moyenne"?60:35,"#44aaff")}
    ${infoBox("HABITAT","rgba(0,100,50,0.1)","#003322","#006622","#88ccaa",dr.habitat)}
    ${infoBox("DONNÉES","rgba(0,50,100,0.1)","#001133","#004488","#88aacc",dr.description)}
    ${infoBox("⚡ FAIT RARE","rgba(100,80,0,0.1)","#332200","#664400","#ccaa66",dr.anecdote)}
    <div style="margin-top:8px;text-align:center;font-size:8px;color:${CONS_COLORS[dr.conservation]||"#888"}">${dr.conservationLabel||""}</div>
  </div>`;
}

// ── Collection Grid ───────────────────────────────────────────────────────────
function collectionGridHTML(){
  const{collection,filterClass,filterCons,sortBy}=S;
  const classes=[...new Set(collection.map(e=>e.result.classe).filter(Boolean))];
  const consStatuses=[...new Set(collection.map(e=>e.result.conservation).filter(Boolean))];

  const filtered=collection
    .filter(e=>filterClass==="all"||e.result.classe===filterClass)
    .filter(e=>filterCons==="all"||e.result.conservation===filterCons)
    .sort((a,b)=>{
      if(sortBy==="numero")return parseInt(a.result.numero)-parseInt(b.result.numero);
      if(sortBy==="date")return b.id-a.id;
      if(sortBy==="alpha")return(a.result.nomCommun||"").localeCompare(b.result.nomCommun||"");
      if(sortBy==="rarity"){const cv={LC:1,NT:2,VU:3,EN:4,CR:5,EX:6};return(cv[b.result.conservation]||0)-(cv[a.result.conservation]||0);}
      return 0;
    });

  const byNumero={};
  collection.forEach(e=>{byNumero[parseInt(e.result.numero)]=e;});
  const pct=Math.round((collection.length/TOTAL_SLOTS)*100);

  if(collection.length===0)return`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:260px;gap:14px"><div class="pulse" style="font-size:36px">📭</div><div style="color:#006622;font-size:8px;text-align:center;line-height:2">POKÉDEX VIDE<br/><span style="color:#004411;font-size:7px">SCANNE TON PREMIER ANIMAL</span></div></div>`;

  return`
    <div style="margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <select onchange="set({filterClass:this.value})">
        <option value="all"${filterClass==="all"?" selected":""}>TOUTES CLASSES</option>
        ${classes.map(c=>`<option value="${c}"${filterClass===c?" selected":""}>${c.toUpperCase()}</option>`).join("")}
      </select>
      <select onchange="set({filterCons:this.value})">
        <option value="all"${filterCons==="all"?" selected":""}>TOUS STATUTS</option>
        ${consStatuses.map(c=>`<option value="${c}"${filterCons===c?" selected":""}>${c}</option>`).join("")}
      </select>
    </div>
    <div style="margin-bottom:10px;display:flex;gap:4px;flex-wrap:wrap;align-items:center">
      <span style="color:#555;font-size:6px;margin-right:2px">TRI:</span>
      ${[["numero","#"],["date","DATE"],["alpha","A-Z"],["rarity","RARETÉ"]].map(([v,l])=>`<button onclick="set({sortBy:'${v}'})" class="btn" style="background:${sortBy===v?"#cc0000":"transparent"};color:${sortBy===v?"#fff":"#886666"};border:1px solid ${sortBy===v?"#cc0000":"#440000"};border-radius:3px;padding:3px 7px;font-size:6px">${l}</button>`).join("")}
    </div>
    <div style="margin-bottom:10px;padding:6px 10px;background:rgba(0,255,100,0.05);border:1px solid #004422;border-radius:6px">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px">
        <span style="color:#00ff88;font-size:7px">COMPLÉTION</span>
        <span style="color:#fff;font-size:7px">${collection.length}/${TOTAL_SLOTS}</span>
      </div>
      <div style="background:#1a0a0a;height:8px;border-radius:2px;border:1px solid #333;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:linear-gradient(90deg,#00aa44,#00ff88);box-shadow:0 0 6px #00ff8866;transition:width 1s"></div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-height:460px;overflow-y:auto">
      ${Array.from({length:TOTAL_SLOTS},(_,i)=>{
        const num=i+1;
        const entry=filterClass==="all"&&filterCons==="all"?byNumero[num]:filtered.find(e=>parseInt(e.result.numero)===num);
        const discovered=!!entry;
        const r=entry?.result;
        const isSelected=false;
        return`<div class="grid-cell" onclick="${discovered?`openModal(${JSON.stringify(JSON.stringify(entry)).slice(1,-1)})`:"return"}" style="background:${discovered?"rgba(0,255,100,0.06)":"rgba(0,0,0,0.4)"};border:1px solid ${discovered?"#004422":"#1a1a1a"};cursor:${discovered?"pointer":"default"}">
          ${discovered
            ?(entry.image?`<img src="${entry.image}" style="width:100%;height:44px;object-fit:cover;border-radius:3px;margin-bottom:2px"/>`:`<div style="font-size:22px;margin-bottom:2px">${CLASS_EMOJI[r?.classe]||"🦎"}</div>`)
            :`<div style="color:#1a1a1a;font-size:18px;margin-bottom:2px">?</div>`}
          <div style="color:${discovered?"#00ff88":"#222"};font-size:7px;font-family:'Press Start 2P',monospace">#${String(num).padStart(3,"0")}</div>
          ${discovered?`<div style="color:#aaffcc;font-size:6px;font-family:'Press Start 2P',monospace;text-align:center;overflow:hidden;max-width:100%;text-overflow:ellipsis;white-space:nowrap">${(r?.nomCommun||"").toUpperCase().slice(0,6)}</div>`:""}
          ${discovered?`<div style="position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:${CONS_COLORS[r?.conservation]||"#666"}"></div>`:""}
        </div>`;
      }).join("")}
    </div>
    ${(filterClass!=="all"||filterCons!=="all")?`<div style="margin-top:10px;padding:6px 10px;background:rgba(255,100,0,0.05);border:1px solid #442200;border-radius:6px">
      <div style="color:#ffaa44;font-size:7px;margin-bottom:6px">${filtered.length} RÉSULTAT(S)</div>
      <div style="display:flex;flex-direction:column;gap:4px;max-height:200px;overflow-y:auto">
        ${filtered.map(e=>`<div onclick="openModal(${JSON.stringify(JSON.stringify(e)).slice(1,-1)})" style="display:flex;align-items:center;gap:8px;padding:5px 8px;background:rgba(0,255,100,0.04);border:1px solid #004422;border-radius:4px;cursor:pointer"><span style="color:#00ff88;font-size:7px">#${e.result.numero}</span><span style="color:#fff;font-size:7px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${(e.result.nomCommun||"").toUpperCase()}</span><span style="background:${CONS_COLORS[e.result.conservation]||"#666"};color:#fff;font-size:6px;font-family:'Press Start 2P',monospace;padding:2px 4px;border-radius:2px">${e.result.conservation}</span></div>`).join("")}
      </div>
    </div>`:""}`;
}

// ── Stats Panel ───────────────────────────────────────────────────────────────
function statsHTML(){
  const{collection}=S;
  const total=collection.length;
  const pct=Math.round((total/TOTAL_SLOTS)*100);
  const byClass={},byCons={};
  collection.forEach(e=>{
    const cl=e.result.classe||"Autre";byClass[cl]=(byClass[cl]||0)+1;
    const cs=e.result.conservation||"?";byCons[cs]=(byCons[cs]||0)+1;
  });
  const topClass=Object.entries(byClass).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const threatened=(byCons.VU||0)+(byCons.EN||0)+(byCons.CR||0);

  return`<div style="padding:14px">
    <div style="margin-bottom:14px;padding:10px 12px;background:rgba(0,255,100,0.05);border:1px solid #004422;border-radius:8px">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <span style="color:#00ff88;font-size:9px">COMPLÉTION</span>
        <span style="color:#fff;font-size:9px">${total}/${TOTAL_SLOTS}</span>
      </div>
      <div style="background:#1a0a0a;height:14px;border-radius:3px;border:1px solid #333;overflow:hidden;margin-bottom:4px">
        <div style="width:${pct}%;height:100%;background:linear-gradient(90deg,#00aa44,#00ff88);box-shadow:0 0 8px #00ff8888;transition:width 1.5s;display:flex;align-items:center;justify-content:flex-end">
          ${pct>10?`<span style="color:#000;font-size:8px;font-weight:bold;font-family:'Press Start 2P',monospace;padding-right:4px">${pct}%</span>`:""}
        </div>
      </div>
      <div style="color:#006622;font-size:7px">${TOTAL_SLOTS-total} espèces manquantes</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">

// ── D3 Map init ───────────────────────────────────────────────────────────────
function initMap(){
  const svg=document.getElementById("worldmap");
  if(!svg)return;
  const d3=window.d3,topo=window.topojson;
  if(!d3||!topo){setTimeout(()=>initMap(),300);return;}
  // Clear previous render
  d3.select(svg).selectAll("*").remove();
  const W=460,H=230;
  const s=d3.select(svg).attr("viewBox",`0 0 ${W} ${H}`).attr("width","100%");
  s.append("rect").attr("width",W).attr("height",H).attr("fill","#0a1628");
  const proj=d3.geoNaturalEarth1().scale(75).translate([W/2,H/2]);
  const path=d3.geoPath(proj);
  const graticule=d3.geoGraticule()();
  s.append("path").datum(graticule).attr("d",path).attr("fill","none").attr("stroke","#1a3a6a").attr("stroke-width",0.3);

  const countryToRegion={};
  Object.entries(REGION_IDS).forEach(([region,ids])=>ids.forEach(id=>countryToRegion[id]=region));

  fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
    .then(r=>r.json())
    .then(world=>{
      const countries=topo.feature(world,world.objects.countries);
      s.selectAll(".c").data(countries.features).join("path")
        .attr("class","c").attr("d",path)
        .attr("fill",d=>getMapColor(countryToRegion[parseInt(d.id)])||"#1a2a1a")
        .attr("stroke","#0a1a0a").attr("stroke-width",0.4)
        .style("cursor","pointer")
        .on("mouseover",function(event,d){
          const region=countryToRegion[parseInt(d.id)];
          d3.select(this).attr("stroke","#00ff88").attr("stroke-width",1.2);
          const tt=document.getElementById("map-tooltip");
          if(tt&&region){
            const count=S.collection.filter(e=>(e.result.region||"Mondial")===region).length;
            tt.style.display="block";
            tt.style.left=Math.min(event.offsetX+8,300)+"px";
            tt.style.top=Math.max(event.offsetY-30,4)+"px";
            tt.innerHTML=`<div style="color:#00ff88;font-size:7px;font-family:'Press Start 2P',monospace">${region}</div><div style="color:#aaffcc;font-size:12px;font-family:'VT323',monospace;margin-top:2px">${count} espèce${count>1?"s":""}</div>`;
            set({hoveredRegion:region});
          }
        })
        .on("mouseout",function(){
          d3.select(this).attr("stroke","#0a1a0a").attr("stroke-width",0.4);
          const tt=document.getElementById("map-tooltip");
          if(tt)tt.style.display="none";
          set({hoveredRegion:null});
        });
      s.append("path").datum(topo.mesh(world,world.objects.countries,(a,b)=>a!==b))
        .attr("d",path).attr("fill","none").attr("stroke","#0a1a0a").attr("stroke-width",0.3);
    }).catch(()=>{});
}

// ── Actions ───────────────────────────────────────────────────────────────────
function resetScan(){set({image:null,result:null,error:null,scanning:false,loading:false,converting:false,progress:0});}
function handleFile(input){const f=input.files[0];input.value="";if(!f)return;processImage(f);}

async function processImage(file){
  set({result:null,error:null,image:null,converting:true,scanning:false,loading:false,progress:0});
  let jpeg;
  try{jpeg=await convertToJpeg(file);}catch(e){set({error:e.message,converting:false});return;}
  set({converting:false,image:jpeg,scanning:true,loading:true,progress:0});
  let prog=0;
  const iv=setInterval(()=>{prog+=Math.random()*11;if(prog>=88){prog=88;clearInterval(iv);}set({progress:Math.min(prog,88)});},180);
  try{
    const base64=jpeg.split(",")[1];
    const res=await fetch("/api/scan",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({imageBase64:base64,mediaType:"image/jpeg"})
    });
    clearInterval(iv);
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||"Erreur serveur "+res.status);
    if(data.found){
      const entry={id:Date.now(),date:new Date().toLocaleDateString("fr-FR"),image:jpeg,result:data};
      saveCollection([entry,...S.collection]);
    }
    set({result:data,scanning:false,loading:false,progress:100});
  }catch(e){clearInterval(iv);set({error:e.message,scanning:false,loading:false,progress:0});}
}

function fixCollection(){
  const VALID=["Europe","Afrique","Amérique du Nord","Amérique du Sud","Asie","Asie du Sud-Est","Océanie","Arctique","Antarctique"];
  const col=[...S.collection];
  const usedNums=new Set();
  col.forEach(e=>{
    // Fix numero
    let num=e.result.numero;
    const name=e.result.nomScientifique||e.result.nomCommun||"";
    if(!num||num==="042"||num==="NNN"||usedNums.has(num)){
      let hash=0;
      for(let i=0;i<name.length;i++)hash=((hash<<5)-hash)+name.charCodeAt(i);
      let n=Math.abs(hash%899)+100;
      let tries=0;
      while(usedNums.has(String(n))&&tries++<50)n=(n%899)+100;
      num=String(n);
    }
    usedNums.add(num);
    e.result.numero=num;
    // Fix region
    if(!VALID.includes(e.result.region)){
      const r=(e.result.region||"").toLowerCase();
      const nom=(e.result.nomCommun||"").toLowerCase();
      if(r.includes("europe"))e.result.region="Europe";
      else if(r.includes("afrique")||r.includes("africa"))e.result.region="Afrique";
      else if(r.includes("sud-est")||r.includes("southeast"))e.result.region="Asie du Sud-Est";
      else if(r.includes("nord")||r.includes("north"))e.result.region="Amérique du Nord";
      else if(r.includes("sud")||r.includes("south"))e.result.region="Amérique du Sud";
      else if(r.includes("asie")||r.includes("asia"))e.result.region="Asie";
      else if(r.includes("océanie")||r.includes("australia"))e.result.region="Océanie";
      else if(r.includes("arctique")||r.includes("arctic"))e.result.region="Arctique";
      else if(r.includes("antarc"))e.result.region="Antarctique";
      else if(nom.includes("ours polaire")||nom.includes("phoque"))e.result.region="Arctique";
      else if(nom.includes("lion")||nom.includes("guépard")||nom.includes("fennec")||nom.includes("zèbre"))e.result.region="Afrique";
      else if(nom.includes("panda"))e.result.region="Asie";
      else if(nom.includes("capucin")||nom.includes("jaguar")||nom.includes("tapir"))e.result.region="Amérique du Sud";
      else if(nom.includes("ours")||nom.includes("loup")||nom.includes("renard"))e.result.region="Europe";
      else e.result.region="Afrique";
    }
  });
  saveCollection(col);
  alert("✓ "+col.length+" entrées corrigées !");
}
